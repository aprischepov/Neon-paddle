name: iOS CI - Store Clean (no gray)

# Runs only when commit message contains [store], or manually via workflow_dispatch.
# Example commit: "fix button layout [store]"
on:
  push:
    branches: [ "store-clean" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    # Skip push-triggered runs that don't have [store] in the commit message.
    # workflow_dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[store]')

    env:
      BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
      EXTENSION_BUNDLE_IDENTIFIER: ${{ secrets.EXTENSION_BUNDLE_IDENTIFIER }}
      EXTENSION_TARGET_NAME: ${{ secrets.EXTENSION_TARGET_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: Import Signing Assets
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE }}
        p12-password: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE_PASSWORD }}
        p12-import-location: "file"
        create-keychain: true
        keychain-password: "temp_password"

    - name: Install Main Provisioning Profile
      run: |
        echo "${{ secrets.APPSTORE_CONNECT_PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision
        if [ ! -s profile.mobileprovision ]; then
          echo "❌ Error: Failed to decode provisioning profile"
          exit 1
        fi
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
        if [ -z "$UUID" ]; then
          echo "❌ Error: Failed to extract UUID from provisioning profile"
          exit 1
        fi
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
        echo "✅ Main profile installed: $UUID"

    # Extension profile — optional. Skipped when secret is not set.
    - name: Install Extension Provisioning Profile (optional)
      id: ext_profile
      run: |
        EXT_B64="${{ secrets.APPSTORE_CONNECT_EXTENSION_PROVISIONING_PROFILE }}"
        EXT_BUNDLE="${{ secrets.EXTENSION_BUNDLE_IDENTIFIER }}"
        EXT_TARGET="${{ secrets.EXTENSION_TARGET_NAME }}"

        if [ -z "$EXT_TARGET" ]; then
          echo "⚠️  EXTENSION_TARGET_NAME not set — building without extension target"
          echo "has_extension=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "$EXT_B64" | base64 --decode > profile_extension.mobileprovision
        if [ ! -s profile_extension.mobileprovision ]; then
          echo "❌ Error: Failed to decode extension provisioning profile"
          exit 1
        fi
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        UUID_EXT=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile_extension.mobileprovision)")
        if [ -z "$UUID_EXT" ]; then
          echo "❌ Error: Failed to extract UUID from extension provisioning profile"
          exit 1
        fi
        cp profile_extension.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID_EXT.mobileprovision
        echo "✅ Extension profile installed: $UUID_EXT"
        echo "has_extension=true" >> $GITHUB_OUTPUT
        echo "ext_profile_uuid=$UUID_EXT" >> $GITHUB_OUTPUT

    # Build number = GitHub Actions run number (always increments, unique per repo).
    - name: Set Build Number
      run: |
        BUILD_NUMBER=${{ github.run_number }}
        echo "📦 Build number: $BUILD_NUMBER"

        # Update CURRENT_PROJECT_VERSION in both Debug and Release build settings
        sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" \
          "${{ secrets.TARGET_PROJECT }}.xcodeproj/project.pbxproj"

        echo "✅ CURRENT_PROJECT_VERSION set to $BUILD_NUMBER"

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project ${{ secrets.TARGET_PROJECT }}.xcodeproj \
          -scheme "${{ secrets.TARGET_PROJECT }}"

    - name: Build and Archive iOS App
      run: |
        mkdir -p ./output

        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
        echo "✅ Main profile UUID: $PROFILE_UUID"

        BUNDLE_ID="$BUNDLE_IDENTIFIER"
        if [ -z "$BUNDLE_ID" ]; then
          echo "❌ Error: BUNDLE_IDENTIFIER secret is not set"
          exit 1
        fi

        KEYCHAIN_PATH=$(security list-keychains | grep -i "keychain" | head -1 | tr -d ' ' | tr -d '"')
        [ -z "$KEYCHAIN_PATH" ] && KEYCHAIN_PATH="$HOME/Library/Keychains/login.keychain-db"
        security unlock-keychain -p "temp_password" "$KEYCHAIN_PATH" 2>/dev/null || true

        CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null \
          | grep -E "(Apple Distribution|iPhone Distribution)" | head -1 \
          | sed -E 's/.*"([^"]+)".*/\1/' || echo "Apple Distribution")
        echo "✅ Code sign identity: $CODE_SIGN_IDENTITY"

        # Push: keep aps-environment only when the main provisioning profile supports it.
        PROFILE_CONTENT=$(security cms -D -i profile.mobileprovision 2>/dev/null)
        HAS_PUSH=$(echo "$PROFILE_CONTENT" | grep -i "aps-environment" || echo "")
        ENTITLEMENTS_PATH="${{ secrets.TARGET_PROJECT }}/${{ secrets.TARGET_PROJECT }}.entitlements"
        ENTITLEMENTS_TMP="${ENTITLEMENTS_PATH}.tmp"

        if [ -z "$HAS_PUSH" ]; then
          echo "⚠️  Warning: provisioning profile doesn't support Push Notifications — stripping aps-environment for this build"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict/>'
            echo '</plist>'
          } > "$ENTITLEMENTS_TMP"
          cp "$ENTITLEMENTS_TMP" "$ENTITLEMENTS_PATH"
        else
          echo "✅ Provisioning profile supports Push Notifications — using $ENTITLEMENTS_PATH"
        fi

        HAS_EXT="${{ steps.ext_profile.outputs.has_extension }}"
        EXT_PROFILE_UUID="${{ steps.ext_profile.outputs.ext_profile_uuid }}"
        EXT_TARGET="${{ secrets.EXTENSION_TARGET_NAME }}"

        # Configure signing via the shared script.
        # Passes extension args only when extension secrets are set.
        export CI_PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
        export CI_CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"
        export CI_DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"
        export EXTENSION_BUNDLE_IDENTIFIER="$EXTENSION_BUNDLE_IDENTIFIER"

        SPM_SCRIPT=".github/scripts/exclude_spm_from_signing.py"
        if [ ! -f "$SPM_SCRIPT" ]; then
          echo "❌ Error: $SPM_SCRIPT not found"
          exit 1
        fi

        if [ "$HAS_EXT" = "true" ]; then
          echo "🔧 Signing: main + extension ($EXT_TARGET)"
          python3 "$SPM_SCRIPT" \
            "${{ secrets.TARGET_PROJECT }}.xcodeproj/project.pbxproj" \
            "$PROFILE_UUID" \
            "${{ secrets.TARGET_PROJECT }}" \
            "$EXT_PROFILE_UUID" \
            "$EXT_TARGET"
        else
          echo "🔧 Signing: main target only"
          python3 "$SPM_SCRIPT" \
            "${{ secrets.TARGET_PROJECT }}.xcodeproj/project.pbxproj" \
            "$PROFILE_UUID" \
            "${{ secrets.TARGET_PROJECT }}"
        fi

        xcodebuild \
          -project ${{ secrets.TARGET_PROJECT }}.xcodeproj \
          -scheme "${{ secrets.TARGET_PROJECT }}" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath ./output/${{ secrets.TARGET_PROJECT }}.xcarchive \
          -skipPackageUpdates \
          DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
          COMPILER_INDEX_STORE_ENABLE=NO \
          SWIFT_COMPILATION_MODE=wholemodule \
          ONLY_ACTIVE_ARCH=NO \
          archive 2>&1 | tee xcodebuild.log

        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
          echo "❌ Build failed (exit $BUILD_EXIT_CODE)"
          exit 1
        fi
        echo "✅ Build finished"

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-logs
        path: xcodebuild.log

    - name: Create Export Options
      run: |
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
        BUNDLE_ID="$BUNDLE_IDENTIFIER"
        HAS_EXT="${{ steps.ext_profile.outputs.has_extension }}"

        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
          echo '<plist version="1.0">'
          echo '<dict>'
          echo '    <key>method</key>'
          echo '    <string>app-store-connect</string>'
          echo '    <key>teamID</key>'
          echo "    <string>${{ secrets.TEAM_ID }}</string>"
          echo '    <key>signingStyle</key>'
          echo '    <string>manual</string>'
          echo '    <key>provisioningProfiles</key>'
          echo '    <dict>'
          echo "        <key>${BUNDLE_ID}</key>"
          echo "        <string>${PROFILE_NAME}</string>"

          if [ "$HAS_EXT" = "true" ] && [ -f "profile_extension.mobileprovision" ]; then
            EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i profile_extension.mobileprovision)")
            echo "        <key>${EXTENSION_BUNDLE_IDENTIFIER}</key>"
            echo "        <string>${EXT_PROFILE_NAME}</string>"
          fi

          echo '    </dict>'
          echo '    <key>uploadBitcode</key>'
          echo '    <false/>'
          echo '    <key>uploadSymbols</key>'
          echo '    <false/>'
          echo '</dict>'
          echo '</plist>'
        } > ExportOptions.plist

        echo "✅ ExportOptions.plist created"
        plutil -lint ExportOptions.plist
        cat ExportOptions.plist

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath ./output/${{ secrets.TARGET_PROJECT }}.xcarchive \
                   -exportOptionsPlist ./ExportOptions.plist \
                   -exportPath ./output

        IPA_FILE=$(find ./output -maxdepth 1 -name "*.ipa" -type f | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ IPA not created"
          ls -lah ./output/
          exit 1
        fi
        mv "$IPA_FILE" ./output/${{ secrets.TARGET_PROJECT }}.ipa
        echo "✅ IPA exported: ./output/${{ secrets.TARGET_PROJECT }}.ipa"

    - name: Upload to App Store Connect
      env:
        API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
        chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8

        xcrun altool --upload-app \
          --type ios \
          --file "./output/${{ secrets.TARGET_PROJECT }}.ipa" \
          --apiKey "$API_KEY_ID" \
          --apiIssuer "$API_ISSUER_ID" \
          --verbose

        echo "✅ Uploaded to App Store Connect"
